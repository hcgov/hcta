.small{padding:12px;border-radius:10px;background:rgba(255,255,255,0.02)}
footer{margin-top:28px;padding:18px;color:var(--muted);font-size:14px;border-top:1px solid rgba(255,255,255,0.02);display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px}
